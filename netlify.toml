# One Netlify site deploys the full Next.js app:
#   /          → frontend (chat UI)
#   /api/*     → backend (Groq API routes)
# App path: chatgpt-trust-prototype/
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  base = "chatgpt-trust-prototype"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
